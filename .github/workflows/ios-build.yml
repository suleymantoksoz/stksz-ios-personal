# =====================================================================
# STKSZ Capital · iOS Build (CI/CD)
# ---------------------------------------------------------------------
# macOS runner: npm sync:ios → pod install → xcodebuild archive →
#               .ipa export (artifact) veya TestFlight yukleme.
#
# GEREKLI GITHUB SECRETS (Settings → Secrets → Actions):
#   BUILD_CERTIFICATE_BASE64   — .p12 sertifikasi (base64)
#   P12_PASSWORD               — .p12 sifresi
#   PROVISION_PROFILE_BASE64   — .mobileprovision (base64)
#   KEYCHAIN_PASSWORD          — Geici keychain sifresi (herhangi bir sey)
#   TEAM_ID                    — Apple Developer Team ID (ör: ABCDEF1234)
#   APP_STORE_CONNECT_API_KEY_ID      — App Store Connect API Key ID
#   APP_STORE_CONNECT_API_ISSUER_ID   — App Store Connect API Issuer ID
#   APP_STORE_CONNECT_API_PRIVATE_KEY — App Store Connect API Private Key (.p8 icerigi)
#
# OPSIYONEL SECRETS (TestFlight otomatik yukleme icin):
#   APPLE_ID           — Apple ID e-posta
#   APPLE_APP_SPECIFIC_PASSWORD — App-specific password (appleid.apple.com)
#
# KULLANIM:
#   - push/main tetiklenir → otomatik .ipa artifact olusturulur
#   - workflow_dispatch ile manuel tetiklenebilir
#   - testflight_upload: true yapilirsa otomatik TestFlight'a yuklenir
# =====================================================================
name: iOS Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight_upload:
        description: 'TestFlight yukleme'
        required: false
        default: false
        type: boolean

env:
  BUILD_NUMBER: ${{ github.run_number }}
  MARKETING_VERSION: '1.0.0'

jobs:
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # ── 1) Kaynak kodu checkout ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2) Node.js kurulumu ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: STKSZ Capital/package-lock.json

      # ── 3) npm bagimliliklari ──
      - name: Install npm dependencies
        working-directory: STKSZ Capital
        run: npm ci

      # ── 4) Capacitor iOS senkronizasyonu ──
      - name: Capacitor sync ios
        working-directory: STKSZ Capital
        run: npx cap sync ios

      # ── 5) CocoaPods kurulumu ──
      - name: Install CocoaPods
        working-directory: STKSZ Capital/ios/App
        run: pod install --repo-update

      # ── 6) Sertifika ve Provisioning Profile kurulumu ──
      - name: Install Code Signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Geici keychain olustur
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sertifikayi (.p12) import et
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Provisioning profile'u kur
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            $(security cms -D -i "$PROFILE_PATH"))
          cp "$PROFILE_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      # ── 7) Xcode versiyon secimi ──
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 8) Build numarasi ayarla ──
      - name: Set build number
        working-directory: STKSZ Capital/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" \
            App/Info.plist

      # ── 9) Archive (xcodebuild) ──
      - name: Archive iOS app
        working-directory: STKSZ Capital/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/build.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      # ── 10) Export Options plist olustur ──
      - name: Create ExportOptions.plist
        run: |
          TEAM_ID="${{ secrets.TEAM_ID }}"
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      # ── 11) Export .ipa ──
      - name: Export IPA
        working-directory: STKSZ Capital/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/build.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa-output \
            | xcpretty

      # ── 12) IPA dosyasini isimlendir ve artifact olarak yukle ──
      - name: Rename IPA
        run: |
          IPA_SRC=$(ls $RUNNER_TEMP/ipa-output/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA_SRC" ]; then
            echo "HATA: .ipa dosyasi bulunamadi!"
            exit 1
          fi
          IPA_DEST="$RUNNER_TEMP/STKSZ_Capital_v${{ env.MARKETING_VERSION }}_build${{ env.BUILD_NUMBER }}.ipa"
          mv "$IPA_SRC" "$IPA_DEST"
          echo "IPA hazir: $IPA_DEST"
          ls -lh "$IPA_DEST"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-Capital-iOS-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/STKSZ_Capital_v${{ env.MARKETING_VERSION }}_build${{ env.BUILD_NUMBER }}.ipa
          retention-days: 30

      # ── 13) TestFlight yukleme (opsiyonel) ──
      - name: Upload to TestFlight
        if: ${{ github.event.inputs.testflight_upload == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          IPA_PATH="$RUNNER_TEMP/STKSZ_Capital_v${{ env.MARKETING_VERSION }}_build${{ env.BUILD_NUMBER }}.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "HATA: IPA dosyasi bulunamadi, TestFlight yuklenemedi."
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID"
          echo "TestFlight yukleme basarili!"

      # ── 14) Cleanup: keychain temizle ──
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
