name: Build STKSZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "STKSZ Capital/www/**"
      - "STKSZ Capital/android/**"
      - "STKSZ Capital/package.json"
      - "STKSZ Capital/capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    name: Build STKSZ debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SRC: STKSZ Capital

    steps:
      # ── 1) Checkout ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2) Proje yapisi kontrol ──
      - name: Verify project structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo ""
          echo "=== STKSZ Capital ==="
          ls -la "$SRC/"
          echo ""
          cd "$SRC"
          for f in package.json capacitor.config.json www/index.html android/gradlew android/app/build.gradle; do
            if [ ! -e "$f" ]; then
              echo "::error::Eksik: $SRC/$f"
              exit 1
            fi
          done
          echo "Tum dosyalar tamam."

      # ── 3) Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "STKSZ Capital/package-lock.json"

      # ── 4) Java 17 Temurin ──
      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 5) Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6) npm install ──
      - name: Install dependencies
        working-directory: STKSZ Capital
        run: npm ci || npm install --no-fund --no-audit

      # ── 7) www dizinini garanti altina al ──
      - name: Ensure www directory exists
        run: mkdir -p "$SRC/www"

      # ── 8) Capacitor sync ──
      - name: Capacitor sync android
        working-directory: STKSZ Capital
        run: npx cap sync android

      # ── 8b) Web varliklarini kopyala ──
      - name: Build Web Assets & Copy
        working-directory: STKSZ Capital
        run: npx cap copy android

      # ── 9) Gradle izni (root + android) ──
      - name: Grant gradlew execute permission
        run: |
          chmod +x "$SRC/android/gradlew"
          chmod +x "$SRC/gradlew" 2>/dev/null || true
          ls -la "$SRC/android/gradlew"

      # ── 10) Gradle clean ──
      - name: Gradle clean
        working-directory: STKSZ Capital/android
        run: ./gradlew clean --no-daemon
        continue-on-error: true

      # ── 11) Gradle build ──
      - name: Build debug APK
        id: gradle-build
        working-directory: STKSZ Capital/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"

      # ── 11b) Uretilen APK'lari Listele ──
      - name: Locate APK files
        run: |
          echo "=== Üretilen APK Dosyalari ==="
          find . -name "*.apk" -type f

      # ── 12) Hata teshis (Sadece Build Basarisizsa) ──
      - name: Diagnose build failure
        if: failure() || steps.gradle-build.outcome == 'failure'
        run: |
          echo "=== GRADLE BUILD BASARISIZ ==="
          LOG="$RUNNER_TEMP/gradle-output.log"
          if [ -f "$LOG" ]; then
            grep -C 3 "Caused by:" "$LOG" || true
            tail -n 100 "$LOG"
          fi

      # ── 13) APK yukle (Sadece Build Basariliysa) ──
      - name: Upload APK artifact
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-debug-apk
          path: "**/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      # ── 14) Hata logunu yukle (Sadece Build Basarisizsa) ──
      - name: Upload build log on failure
        if: failure() || steps.gradle-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-gradle-build-log
          path: ${{ runner.temp }}/gradle-output.log
          if-no-files-found: warn
          retention-days: 7
