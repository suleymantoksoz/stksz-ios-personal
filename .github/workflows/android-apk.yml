name: Build STKSZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "STKSZ Capital/www/**"
      - "STKSZ Capital/android/**"
      - "STKSZ Capital/package.json"
      - "STKSZ Capital/capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    name: Build STKSZ debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SRC: STKSZ Capital

    steps:
      # ── 1) Checkout ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2) Proje yapisi kontrol ──
      - name: Verify project structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo ""
          echo "=== STKSZ Capital ==="
          ls -la "$SRC/"
          echo ""
          cd "$SRC"
          for f in package.json capacitor.config.json www/index.html android/gradlew android/app/build.gradle; do
            if [ ! -e "$f" ]; then
              echo "::error::Eksik: $SRC/$f"
              exit 1
            fi
          done
          echo "Tum dosyalar tamam."

      # ── 3) Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "STKSZ Capital/package-lock.json"

      # ── 4) Java 21 Temurin ──
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── 5) Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6) npm install ──
      - name: Install dependencies
        working-directory: STKSZ Capital
        run: npm ci || npm install --no-fund --no-audit

      # ── 7) www dizinini garanti altina al ──
      - name: Ensure www directory exists
        run: mkdir -p "$SRC/www"

      # ── 8) Capacitor sync ──
      - name: Capacitor sync android
        working-directory: STKSZ Capital
        run: npx cap sync android

      # ── 9) Gradle izni (root + android) ──
      - name: Grant gradlew execute permission
        run: |
          chmod +x "$SRC/android/gradlew"
          chmod +x "$SRC/gradlew" 2>/dev/null || true
          ls -la "$SRC/android/gradlew"

      # ── 10) Gradle build ──
      - name: Build debug APK
        id: gradle-build
        working-directory: STKSZ Capital/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all --info 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"
        continue-on-error: true

      # ── 10b) Build basarisizsa hata detayini gosterr ──
      - name: Diagnose build failure
        if: steps.gradle-build.outcome == 'failure'
        run: |
          echo "==============================================="
          echo "  GRADLE BUILD BASARISIZ — HATA ANALIZI"
          echo "==============================================="
          echo ""
          LOG="$RUNNER_TEMP/gradle-output.log"
          if [ -f "$LOG" ]; then
            echo "=== 'Caused by:' satirlari ==="
            grep -n "Caused by:" "$LOG" | tail -20
            echo ""
            echo "=== 'FAILURE' satiri ve ustu (son 50 satir) ==="
            grep -n "FAILURE\|BUILD FAILED\|Could not\|error:" "$LOG" | tail -20
            echo ""
            echo "=== build.gradle dosyasi ==="
            cat app/build.gradle | head -40
            echo ""
            echo "=== gradle.properties ==="
            cat gradle.properties 2>/dev/null || echo "(dosya yok)"
            echo ""
            echo "=== local.properties ==="
            cat local.properties 2>/dev/null || echo "(dosya yok)"
          fi
          exit 1

      # ── 11) APK yukle ──
      - name: Upload APK artifact
        if: steps.gradle-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-debug-apk
          path: STKSZ Capital/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ── 12) Hata logunu artifact olarak yukle ──
      - name: Upload build log on failure
        if: steps.gradle-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-gradle-build-log
          path: ${{ runner.temp }}/gradle-output.log
          if-no-files-found: warn
          retention-days: 7
