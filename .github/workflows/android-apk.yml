name: Build STKSZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "STKSZ Capital/www/**"
      - "STKSZ Capital/android/**"
      - "STKSZ Capital/package.json"
      - "STKSZ Capital/capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    name: Build STKSZ debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SRC: STKSZ Capital

    steps:
      # ── 1) Checkout ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2) Proje yapisi kontrol ──
      - name: Verify project structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo ""
          echo "=== STKSZ Capital ==="
          ls -la "$SRC/"
          echo ""
          cd "$SRC"
          for f in package.json capacitor.config.json www/index.html android/gradlew android/app/build.gradle; do
            if [ ! -e "$f" ]; then
              echo "::error::Eksik: $SRC/$f"
              exit 1
            fi
          done
          echo "Tum dosyalar tamam."

      # ── 3) Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "STKSZ Capital/package-lock.json"

      # ── 4) Java 21 Temurin ──
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ── 5) Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6) npm install ──
      - name: Install dependencies
        working-directory: STKSZ Capital
        run: npm ci || npm install --no-fund --no-audit

      # ── 7) Capacitor sync + copy ──
      - name: Capacitor sync & copy
        working-directory: STKSZ Capital
        run: |
          npx cap sync android
          npx cap copy android

      # ── 8) Gradle izni ──
      - name: Grant gradlew execute permission
        working-directory: STKSZ Capital/android
        run: |
          chmod +x gradlew
          ls -la gradlew

      # ── 9) Gradle build ──
      - name: Build debug APK
        id: gradle-build
        working-directory: STKSZ Capital/android
        run: |
          echo "=== GRADLE VERSION ==="
          ./gradlew --version
          echo "=== BUILD START ==="
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gradle-output.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      # ── 10) APK konumunu dogrula ──
      - name: Verify APK output
        if: always()
        run: |
          echo "=== APK ARAMA ==="
          find "$SRC/android/app/build/outputs" -name "*.apk" -type f 2>/dev/null || echo "APK bulunamadi"
          echo "=== TUM *.apk DOSYALARI ==="
          find "$SRC" -name "*.apk" -type f 2>/dev/null || echo "Hic APK yok"

      # ── 11) APK yukle ──
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-debug-apk
          path: STKSZ Capital/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # ── 12) Hata logunu yukle ──
      - name: Upload build log on failure
        if: failure() || steps.gradle-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-gradle-build-log
          path: ${{ runner.temp }}/gradle-output.log
          if-no-files-found: warn
          retention-days: 7
