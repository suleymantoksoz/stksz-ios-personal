# =====================================================================
# STKSZ Capital · iOS Unsigned IPA Build
# ---------------------------------------------------------------------
# Izole: yalnizca "STKSZ Capital" klasorunu hedef alir.
# Sertifika/secret gerektirmez — tamamen imzasiz .ipa uretir.
# =====================================================================
name: STKSZ Capital iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "STKSZ Capital/**"
      - ".github/workflows/stksz-capital-ios.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    env:
      SRC: STKSZ Capital

    steps:
      # ── 1) Checkout ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2) Izolasyon: STKSZ Capital var mi? ──
      - name: Verify STKSZ Capital exists
        run: |
          echo "=== Repo kok dizini ==="
          ls -la
          echo ""
          echo "=== STKSZ Capital icerigi ==="
          ls -la "$SRC/"
          echo ""
          echo "=== iOS dizini ==="
          ls -la "$SRC/ios/App/"
          echo ""
          # kritik dosyalari kontrol et
          cd "$SRC"
          for f in package.json capacitor.config.json www/index.html ios/App/Podfile ios/App/App.xcworkspace/contents.xcworkspacedata; do
            if [ ! -e "$f" ]; then
              echo "::error::Eksik: $SRC/$f"
              exit 1
            fi
          done
          echo "Tum dosyalar tamam."

      # ── 3) Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "STKSZ Capital/package-lock.json"

      # ── 4) npm install ──
      - name: npm install
        working-directory: STKSZ Capital
        run: npm ci || npm install --no-fund --no-audit

      # ── 5) Capacitor sync ──
      - name: Capacitor sync ios
        working-directory: STKSZ Capital
        run: npx cap sync ios

      # ── 6) CocoaPods ──
      - name: CocoaPods install
        working-directory: STKSZ Capital/ios/App
        run: pod install --repo-update

      # ── 7) Xcode bilgisi ──
      - name: Xcode info
        run: |
          xcodebuild -version
          echo ""
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" | head -3

      # ── 8) Archive (imzasiz) ──
      - name: Build unsigned archive
        working-directory: STKSZ Capital/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/stksz.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO

      # ── 9) .app -> .ipa ──
      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/stksz.xcarchive/Products/Applications/App.app"

          if [ ! -d "$APP" ]; then
            echo "::error::App.app bulunamadi"
            find "$RUNNER_TEMP/stksz.xcarchive" -maxdepth 4 -type d
            exit 1
          fi

          echo "=== App.app Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist" 2>/dev/null || true

          OUT="$RUNNER_TEMP/ipa"
          rm -rf "$OUT" STKSZ.ipa
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/App.app"
          xattr -cr "$OUT" || true
          find "$OUT" -name ".DS_Store" -delete || true

          cd "$OUT"
          zip -r -X "$RUNNER_TEMP/STKSZ.ipa" Payload
          unzip -t "$RUNNER_TEMP/STKSZ.ipa" > /dev/null && echo "ZIP butunlugu: OK"
          ls -lh "$RUNNER_TEMP/STKSZ.ipa"

      # ── 10) Artifact yukle ──
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STKSZ-Capital-iOS-Unsigned
          path: ${{ runner.temp }}/STKSZ.ipa
          if-no-files-found: error
          retention-days: 14
