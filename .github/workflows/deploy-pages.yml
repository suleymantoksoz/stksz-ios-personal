name: Deploy STKSZ to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["STKSZ Capital/www/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish STKSZ Capital/www/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload STKSZ Capital/www/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: STKSZ Capital/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
